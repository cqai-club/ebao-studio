name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical vMAJOR.MINOR.PATCH tag to create AFTER master packaging succeeds
        required: true
        type: string
      macos_mode:
        description: Signed production artifacts, or an explicitly unsigned macOS test release
        required: true
        default: signed
        type: choice
        options:
          - signed
          - unsigned-test

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_REF: ${{ github.sha }}
  MACOS_UNSIGNED_TEST: ${{ inputs.macos_mode == 'unsigned-test' }}

jobs:
  verify:
    # Dispatch exclusively from master; every checkout uses the dispatch SHA.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: release-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Verify master promotion and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-flow.mjs preflight
      - name: Run complete headless gate
        run: yarn check

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: pwsh
        run: "Add-Content -Path $env:GITHUB_OUTPUT -Value \"dir=$(yarn config get cacheFolder)\""
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: release-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
      - run: corepack enable
      - name: Build Windows MatrixMedia Publisher Worker
        working-directory: matrixmedia-publisher
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          corepack yarn@1.22.22 install --frozen-lockfile
          corepack yarn@1.22.22 test:publisher-worker
          corepack yarn@1.22.22 build:dir
          corepack yarn@1.22.22 electron-builder --config electron-builder.publisher.yml --win dir --x64 --publish never
      - name: Smoke Windows Publisher Worker lifecycle
        run: node scripts/smoke-windows-publisher-worker.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Run Windows package gate
        run: yarn workspace dsh-plugin-desktop check:win-package
      - name: Build unsigned Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build unsigned Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - name: Verify fresh packaged Windows video environment installation
        timeout-minutes: 10
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dsh-plugin-desktop/dist/win-unpacked'
          $executables = @(Get-ChildItem -LiteralPath $app -Filter '*.exe' -File)
          if ($executables.Count -ne 1) { throw 'Expected one packaged Desktop executable' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          # PowerShell does not wait for a Windows GUI executable invoked with &.
          # Wait for Electron's Node process and check its actual exit code.
          $arguments = @('scripts/verify-media-common-tools.mjs', '--short-video', '--runtime-root', ('"{0}"' -f (Join-Path $app 'resources/app.asar')))
          $process = Start-Process -FilePath $executables[0].FullName -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Windows video environment installation failed ($($process.ExitCode))" }
      - name: Stage Windows release assets and updater metadata
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = @(
            "dsh-plugin-desktop/dist/eBao-Studio-$version-x64-Setup.exe",
            "dsh-plugin-desktop/dist/eBao-Studio-$version-x64-Portable.zip",
            "dsh-plugin-desktop/dist/latest.yml"
          )
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected Windows release asset is missing: $asset"
            }
            Copy-Item -LiteralPath $asset -Destination (Join-Path release-assets (Split-Path -Leaf $asset))
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          overwrite: true
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: release-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
      - run: corepack enable
      - name: Build macOS MatrixMedia Publisher Worker
        working-directory: matrixmedia-publisher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          corepack yarn@1.22.22 install --frozen-lockfile
          corepack yarn@1.22.22 test:publisher-worker
          corepack yarn@1.22.22 build:publisher-worker:universal
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Run macOS package gate
        run: yarn workspace dsh-plugin-desktop check:mac-package
      - name: Build signed and notarized macOS updater artifacts
        if: env.MACOS_UNSIGNED_TEST != 'true'
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn workspace dsh-plugin-desktop dist:mac
      - name: Build unsigned macOS test updater artifacts
        if: env.MACOS_UNSIGNED_TEST == 'true'
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - name: Stage macOS release assets and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          output_dir='dsh-plugin-desktop/dist/mac-release'
          if [[ "$MACOS_UNSIGNED_TEST" == 'true' ]]; then
            output_dir='dsh-plugin-desktop/dist/mac-smoke'
          fi
          assets=(
            "$output_dir/eBao-Studio-${version}-universal.dmg"
            "$output_dir/eBao-Studio-${version}-universal.zip"
            "$output_dir/latest-mac.yml"
          )
          mkdir -p release-assets
          for asset in "${assets[@]}"; do
            test -f "$asset"
            cp "$asset" "release-assets/$(basename "$asset")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          overwrite: true
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: release-assets
      - name: Verify assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          checksum_assets=(
            "eBao-Studio-${version}-universal.dmg"
            "eBao-Studio-${version}-universal.zip"
            "eBao-Studio-${version}-x64-Setup.exe"
            "eBao-Studio-${version}-x64-Portable.zip"
          )
          expected=("${checksum_assets[@]}" latest.yml latest-mac.yml)
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done
          if [[ "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" != '6' ]]; then
            echo 'Unexpected release asset set:' >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum "${checksum_assets[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          node scripts/verify-release-assets.mjs --directory release-assets --version "$version"
      - name: Record verified packaging provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-flow.mjs record
      - name: Preserve verified artifacts before creating a tag
        uses: actions/upload-artifact@v7
        with:
          name: release-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/*
            release-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Create immutable tag and publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-flow.mjs publish
      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$downloaded"
          node scripts/verify-release-assets.mjs --directory "$downloaded" --version "${RELEASE_TAG#v}"
