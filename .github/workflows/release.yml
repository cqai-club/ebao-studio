name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing canonical vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string
      macos_mode:
        description: Signed production artifacts, or an explicitly unsigned macOS test release
        required: true
        default: signed
        type: choice
        options:
          - signed
          - unsigned-test
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}
  MACOS_UNSIGNED_TEST: ${{ inputs.macos_mode == 'unsigned-test' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: release-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be canonical vMAJOR.MINOR.PATCH SemVer: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_VERSION="$release_version" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const releaseVersion = process.env.RELEASE_VERSION
          const stable = JSON.parse(readFileSync('dsh-plugin-desktop/package.json', 'utf8'))
          const beta = JSON.parse(readFileSync('dsh-plugin-desktop-beta/package.json', 'utf8'))
          const releaseIndex = JSON.parse(readFileSync('release/desktop-version.json', 'utf8'))
          if (stable.version !== releaseVersion) {
            throw new Error(`tag ${releaseVersion} does not match stable Desktop ${stable.version}`)
          }
          if (beta.version !== `${releaseVersion}-beta.1`) {
            throw new Error(`beta Desktop ${beta.version} does not match ${releaseVersion}-beta.1`)
          }
          if (releaseIndex.channel !== 'stable' || releaseIndex.version !== releaseVersion) {
            throw new Error(`release index does not select stable ${releaseVersion}`)
          }
          NODE
      - name: Temporarily skip AA profile smoke in CI
        # Remove this step after AA Host service activation is fixed.
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          for (const workspace of ['dsh-plugin-desktop', 'dsh-plugin-desktop-beta']) {
            const path = `${workspace}/package.json`
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            const smoke = ' && yarn run verify:aa'
            if (!manifest.scripts.check.includes(smoke)) throw new Error(`AA check not found in ${workspace}`)
            manifest.scripts.check = manifest.scripts.check.replace(smoke, '')
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE
      - name: Run complete headless gate
        run: yarn check

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: pwsh
        run: "Add-Content -Path $env:GITHUB_OUTPUT -Value \"dir=$(yarn config get cacheFolder)\""
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: release-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
      - run: corepack enable
      - name: Build Windows MatrixMedia Publisher Worker
        working-directory: matrixmedia-publisher
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          corepack yarn@1.22.22 install --frozen-lockfile
          corepack yarn@1.22.22 test:publisher-worker
          corepack yarn@1.22.22 build:dir
          corepack yarn@1.22.22 electron-builder --config electron-builder.publisher.yml --win dir --x64 --publish never
      - name: Smoke Windows Publisher Worker lifecycle
        run: node scripts/smoke-windows-publisher-worker.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Run Windows package gate
        run: yarn workspace dsh-plugin-desktop check:win-package
      - name: Build unsigned Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win
      - name: Build unsigned Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable
      - name: Stage Windows release assets and updater metadata
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $assets = @(
            "dsh-plugin-desktop/dist/eBao-Studio-$version-x64-Setup.exe",
            "dsh-plugin-desktop/dist/eBao-Studio-$version-x64-Portable.zip",
            "dsh-plugin-desktop/dist/latest.yml"
          )
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected Windows release asset is missing: $asset"
            }
            Copy-Item -LiteralPath $asset -Destination (Join-Path release-assets (Split-Path -Leaf $asset))
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: release-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
      - run: corepack enable
      - name: Build macOS MatrixMedia Publisher Worker
        working-directory: matrixmedia-publisher
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          corepack yarn@1.22.22 install --frozen-lockfile
          corepack yarn@1.22.22 test:publisher-worker
          corepack yarn@1.22.22 build:publisher-worker:universal
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Run macOS package gate
        run: yarn workspace dsh-plugin-desktop check:mac-package
      - name: Build signed and notarized macOS updater artifacts
        if: env.MACOS_UNSIGNED_TEST != 'true'
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn workspace dsh-plugin-desktop dist:mac
      - name: Build unsigned macOS test updater artifacts
        if: env.MACOS_UNSIGNED_TEST == 'true'
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop dist:mac-smoke
      - name: Stage macOS release assets and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          output_dir='dsh-plugin-desktop/dist/mac-release'
          if [[ "$MACOS_UNSIGNED_TEST" == 'true' ]]; then
            output_dir='dsh-plugin-desktop/dist/mac-smoke'
          fi
          assets=(
            "$output_dir/eBao-Studio-${version}-universal.dmg"
            "$output_dir/eBao-Studio-${version}-universal.zip"
            "$output_dir/latest-mac.yml"
          )
          mkdir -p release-assets
          for asset in "${assets[@]}"; do
            test -f "$asset"
            cp "$asset" "release-assets/$(basename "$asset")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          # The artifacts were built from RELEASE_REF by the platform jobs. For a
          # manually dispatched release, validate and publish them with the
          # workflow revision that was dispatched, so a verifier repair does not
          # require moving the immutable release tag.
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          checksum_assets=(
            "eBao-Studio-${version}-universal.dmg"
            "eBao-Studio-${version}-universal.zip"
            "eBao-Studio-${version}-x64-Setup.exe"
            "eBao-Studio-${version}-x64-Portable.zip"
          )
          expected=("${checksum_assets[@]}" latest.yml latest-mac.yml)
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done
          if [[ "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" != '6' ]]; then
            echo 'Unexpected release asset set:' >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum "${checksum_assets[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          node scripts/verify-release-assets.mjs --directory release-assets --version "$version"
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_title="易宝工坊 ${RELEASE_TAG}（预发布）"
          macos_note='macOS 自动更新构件必须使用 Developer ID 签名并完成 Apple 公证；本工作流会在缺少签名或公证凭据时失败，而不会发布不可自动更新的 macOS 构件。'
          if [[ "$MACOS_UNSIGNED_TEST" == 'true' ]]; then
            release_title="易宝工坊 ${RELEASE_TAG}（未签名 macOS 测试预发布）"
            macos_note='本次 macOS 构件是未签名测试包：仅供测试者明确下载、在 Gatekeeper 提示中手动授权打开及验证更新发现链路。它不是生产 macOS 自动更新构件；不要将其作为正式发布或静默替换的依据。后续生产 macOS 发布仍必须使用 Developer ID 签名并完成 Apple 公证。'
          fi
          cat > RELEASE_NOTES.md <<'NOTES'
          ## 本次预发布版本

          本版本继续提供 CQAI 账号与“e图宝”生图能力，并加入多平台发布工作台：本地原稿与草稿、平台版本准备、账号管理、发布历史，以及文章、图文和视频内容流程。具体提交方式以各平台在应用内显示的能力为准。

          macOS 与 Windows 构件均包含独立的 Publisher Worker。Windows 用户可以直接添加账号并登录；旧版独立 MatrixMedia 账号导入目前仅在 macOS 提供。

          ### 下载与自动更新

          - Windows x64：安装版 `Setup.exe` 或免安装 `Portable.zip`；已安装的稳定版会在确认后下载 `Setup.exe`，选择“重启并更新”后由安装器自动接管。
          - macOS：Intel 与 Apple Silicon 通用的 `universal.dmg`；`universal.zip` 和 `latest-mac.yml` 仅供已安装应用的安全自动更新使用。
          - `latest.yml`、`latest-mac.yml`：Electron Updater 的 SHA-512 更新元数据。
          - `SHA256SUMS`：四个可下载安装构件的 SHA-256 校验值。

          ### 预发布说明

          __MACOS_RELEASE_NOTE__ Windows 安装包和便携包尚未进行 Authenticode 签名，可能显示“未知发布者”或 SmartScreen 提示。SHA-256 与 Electron Updater 的 SHA-512 仅验证传输完整性，不替代平台代码签名。
          NOTES
          python3 - "$macos_note" <<'PY'
          from pathlib import Path
          import sys

          notes = Path('RELEASE_NOTES.md')
          notes.write_text(notes.read_text().replace('__MACOS_RELEASE_NOTE__', sys.argv[1]))
          PY
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$release_title" \
            --prerelease \
            --notes-file RELEASE_NOTES.md \
            release-assets/*
      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease)"
          RELEASE_JSON="$release_json" RELEASE_TAG="$RELEASE_TAG" node --input-type=module <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON)
          if (release.tagName !== process.env.RELEASE_TAG || release.isPrerelease !== true) {
            throw new Error(`Published release identity is invalid: ${process.env.RELEASE_TAG}`)
          }
          NODE
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$downloaded"
          node scripts/verify-release-assets.mjs --directory "$downloaded" --version "$version"
