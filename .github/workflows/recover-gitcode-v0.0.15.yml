# Temporary recovery control; retain on its audit branch, never promote to dev/master.
# Diagnoses attachment transport using the original verified checksum bytes.
name: Probe GitCode v0.0.15 checksum upload

on:
  push:
    branches: [codex/gitcode-recovery-v0.0.15]

permissions:
  contents: read

concurrency:
  group: gitcode-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository == 'cqai-club/ebao-studio' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/gitcode-recovery-v0.0.15' &&
      vars.GITCODE_SYNC_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cqai-club/ebao-studio
          ref: d5a9fa00f091e54f1c64f9641831b85c00e5bd0d
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable execution source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d5a9fa00f091e54f1c64f9641831b85c00e5bd0d
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Verify cURL availability
        run: curl --disable --version
      - name: Probe original checksum bytes and anonymously verify
        env:
          SOURCE_REPOSITORY: cqai-club/ebao-studio
          GITCODE_REPOSITORY: g-dxw/ebao-studio
          RELEASE_TAG: v0.0.15
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          /** Contingency transport only. Run from an unchanged checkout of SOURCE_SHA. */
          import { execFile, spawn } from 'node:child_process'
          import { ReadStream } from 'node:fs'
          import { stat } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import { promisify } from 'node:util'
          import { pathToFileURL } from 'node:url'

          const SOURCE_SHA = 'd5a9fa00f091e54f1c64f9641831b85c00e5bd0d'
          const SOURCE_FILES = ['scripts/sync-gitcode-release.mjs', 'scripts/release-flow.mjs', 'scripts/verify-release-assets.mjs']
          const exec = promisify(execFile)
          const quote = value => `"${String(value).replaceAll('\\', '\\\\').replaceAll('"', '\\"').replaceAll('\t', '\\t').replaceAll('\r', '\\r').replaceAll('\n', '\\n')}"`
          const aborted = () => Object.assign(new Error('cURL upload aborted by the original deadline'), { name: 'AbortError' })

          // Injection points are for offline tests. Production uses the defaults below.
          export function createCurlPutFetch({ fetchImpl = globalThis.fetch, spawnImpl = spawn, curlExecutable = 'curl', onMetrics = metrics => console.log(JSON.stringify(metrics)) } = {}) {
            return async function curlPutFetch(input, init) {
              if (init?.method !== 'PUT' || !(init.body instanceof ReadStream)) return fetchImpl(input, init)
              const filePath = init.body.path
              init.body.on('error', () => {}) // Asynchronous open can still fail after destroy; stat/cURL own the real error path.
              init.body.destroy() // cURL opens the same already-verified file; do not leak the unused Node stream.
              let url
              try { url = new URL(input) } catch { throw new Error('Invalid cURL upload target') }
              if (url.protocol !== 'https:' || url.username || url.password || typeof filePath !== 'string') throw new Error('Invalid cURL upload target')
              if (!init.headers || Object.getPrototypeOf(init.headers) !== Object.prototype) throw new Error('Invalid cURL upload headers')
              const headers = Object.entries(init.headers)
              if (headers.some(([name, value]) => !/^[!#$%&'*+.^_`|~0-9A-Za-z-]+$/u.test(name) || typeof value !== 'string' || /[\r\n\0]/u.test(value))) throw new Error('Invalid cURL upload headers')
              const lengths = headers.filter(([name]) => name.toLowerCase() === 'content-length')
              if (lengths.length !== 1 || !/^(0|[1-9][0-9]*)$/u.test(lengths[0][1])) throw new Error('Invalid cURL upload size')
              const expectedBytes = Number(lengths[0][1])
              const file = await stat(filePath)
              if (!Number.isSafeInteger(expectedBytes) || !file.isFile() || file.size !== expectedBytes) throw new Error('Verified cURL upload file changed')
              if (init.signal?.aborted) throw aborted()
              const config = [
                'silent', 'show-error', 'globoff', 'proto = "=https"', 'request = "PUT"',
                `url = ${quote(url.href)}`, `upload-file = ${quote(filePath)}`,
                ...headers.map(([name, value]) => `header = ${quote(value === '' ? `${name};` : `${name}: ${value}`)}`),
                `output = ${quote(process.platform === 'win32' ? 'NUL' : '/dev/null')}`,
                'connect-timeout = "30"', 'speed-limit = "16384"', 'speed-time = "90"', 'max-time = "60"',
                `write-out = ${quote('{"httpCode":"%{http_code}","uploadedBytes":%{size_upload}}\n')}`,
              ].join('\n') + '\n'
              const childEnv = { ...process.env }
              for (const name of ['GH_TOKEN', 'GITHUB_TOKEN', 'GITCODE_TOKEN']) delete childEnv[name]
              const result = await new Promise((accept, reject) => {
                let child
                try { child = spawnImpl(curlExecutable, ['--disable', '--config', '-'], { stdio: ['pipe', 'pipe', 'ignore'], env: childEnv, windowsHide: true }) }
                catch { reject(new Error('Unable to start cURL upload')); return }
                let output = '', wasAborted = false, oversized = false, killTimer
                const terminate = () => {
                  child.kill('SIGTERM')
                  killTimer ??= setTimeout(() => child.kill('SIGKILL'), 2000)
                  killTimer.unref()
                }
                const abort = () => {
                  if (wasAborted) return
                  wasAborted = true
                  terminate()
                }
                const cleanup = () => { init.signal?.removeEventListener('abort', abort); clearTimeout(killTimer) }
                init.signal?.addEventListener('abort', abort, { once: true })
                if (init.signal?.aborted) abort()
                child.stdout.on('data', bytes => {
                  if (output.length + bytes.length > 4096) { oversized = true; terminate() }
                  else output += bytes.toString('utf8')
                })
                child.stdin.on('error', () => {}) // EPIPE is represented by the child's safe exit result.
                child.once('error', () => { cleanup(); reject(new Error('Unable to start cURL upload')) })
                child.once('close', (code, signal) => {
                  cleanup()
                  if (wasAborted) { reject(aborted()); return }
                  if (oversized) { reject(new Error('Unexpected cURL upload metrics')); return }
                  let metrics
                  try { metrics = JSON.parse(output) } catch { reject(new Error(`cURL upload ended without valid metrics (exit ${Number.isInteger(code) ? code : 'signal'})`)); return }
                  if (!metrics || !/^[0-9]{3}$/u.test(metrics.httpCode) || !Number.isSafeInteger(metrics.uploadedBytes) || metrics.uploadedBytes < 0 || metrics.uploadedBytes > expectedBytes) { reject(new Error('Unexpected cURL upload metrics')); return }
                  const safeMetrics = { httpCode: metrics.httpCode, uploadedBytes: metrics.uploadedBytes }
                  try { onMetrics(safeMetrics) } catch { reject(new Error('Unable to report safe cURL metrics')); return }
                  if (code !== 0 || signal) { reject(new Error(`cURL upload transport failure (exit ${Number.isInteger(code) ? code : 'signal'})`)); return }
                  const status = Number(metrics.httpCode)
                  if (status < 200 || status > 599) { reject(new Error('Invalid cURL upload HTTP status')); return }
                  if (status >= 200 && status < 300 && metrics.uploadedBytes !== expectedBytes) { reject(new Error('Incomplete cURL upload byte count')); return }
                  accept({ status })
                })
                child.stdin.end(config)
              })
              // The original function consumes and discards the callback body. cURL already discards it.
              return new Response(null, { status: result.status })
            }
          }

          import { execFile as probeExecFile } from 'node:child_process'
          import { createHash as probeCreateHash } from 'node:crypto'
          import { mkdtemp as probeMkdtemp, rm as probeRm, writeFile as probeWriteFile } from 'node:fs/promises'
          import { tmpdir as probeTmpdir } from 'node:os'
          import { join as probeJoin, resolve as probeResolve } from 'node:path'
          import { promisify as probePromisify } from 'node:util'
          import { pathToFileURL as probePathToFileURL } from 'node:url'

          const PROBE_SOURCE_SHA = 'd5a9fa00f091e54f1c64f9641831b85c00e5bd0d'
          const PROBE_SOURCE_FILES = ['scripts/sync-gitcode-release.mjs', 'scripts/release-flow.mjs', 'scripts/verify-release-assets.mjs']
          const PROBE_SMALL_SIZES = new Map([['latest.yml', 342], ['SHA256SUMS', 379], ['latest-mac.yml', 495]])
          const PROBE_UPLOAD_NAME = 'SHA256SUMS'
          const probeExec = probePromisify(probeExecFile)

          // Pure guards are exported only so they can be checked without executing a probe.
          export function probeAssertOwnedRelease(release, source, marker) {
            if (!release || release.tag_name !== source.tag || release.target_commitish !== source.sha
              || release.release_status !== 'pre' || typeof release.body !== 'string' || !release.body.includes(marker)
              || !Array.isArray(release.assets)) throw new Error('Existing release ownership check failed')
          }
          export function probePresentExpected(release, source) {
            const present = []
            for (const asset of source.assets) {
              const matches = release.assets.filter(entry => entry.name === asset.name)
              if (matches.length > 1) throw new Error('Duplicate expected attachment')
              if (!matches.length) continue
              if (!PROBE_SMALL_SIZES.has(asset.name)) throw new Error('Existing large attachment requires a separate full verification; checksum probe will not write')
              present.push(asset)
            }
            return present
          }
          export function probeAssertChecksumBytes(asset, bytes) {
            if (asset?.name !== PROBE_UPLOAD_NAME || asset.size !== 379 || bytes.length !== 379
              || `sha256:${probeCreateHash('sha256').update(bytes).digest('hex')}` !== asset.digest) throw new Error('GitHub checksum bytes differ from verified provenance')
          }

          export async function runSmallProbe() {
            const probeDeadline = AbortSignal.timeout(270_000)
            const probeStarted = Date.now()
            const probeRemaining = () => 270_000 - (Date.now() - probeStarted)
            let probePhase = 'immutable source verification', probeDirectory
            const probeCommand = async (command, args, encoding = 'utf8', maxBuffer = 2 * 1024 * 1024) => {
              if (probeDeadline.aborted) throw new Error('Probe deadline reached')
              return probeExec(command, args, {
                cwd: process.cwd(), encoding, maxBuffer, timeout: Math.max(1, Math.min(30_000, probeRemaining())),
                signal: probeDeadline, killSignal: 'SIGKILL', windowsHide: true,
              })
            }
            const probeFetch = (input, init = {}) => fetch(input, {
              ...init, signal: init.signal ? AbortSignal.any([init.signal, probeDeadline]) : probeDeadline,
            })
            try {
              const { stdout: head } = await probeCommand('git', ['rev-parse', 'HEAD'])
              if (head.trim() !== PROBE_SOURCE_SHA) throw new Error('Wrong execution SHA')
              await probeCommand('git', ['diff', '--quiet', PROBE_SOURCE_SHA, '--', ...PROBE_SOURCE_FILES])
              if (!createCurlPutFetch.toString().includes('max-time = "60"') || createCurlPutFetch.toString().includes('max-time = "1800"')) throw new Error('Checksum probe requires the reviewed 60-second transport')
              const { gitcodeConfig, assertSourceProvenance, validateMirrorSource, mirrorMarker, createGitcodeApi, uploadGitcodeAsset, anonymousAssetDigest } =
                await import(probePathToFileURL(probeResolve(PROBE_SOURCE_FILES[0])).href)
              const config = gitcodeConfig(process.env)
              if (config.tag !== 'v0.0.15' || config.repository !== 'g-dxw/ebao-studio') throw new Error('Wrong checksum probe destination')
              const github = async endpoint => JSON.parse((await probeCommand('gh', ['api', `repos/${config.sourceRepository}/${endpoint}`])).stdout)
              probePhase = 'GitHub release and annotated-tag provenance'
              const release = await github(`releases/tags/${config.tag}`)
              const ref = await github(`git/ref/tags/${config.tag}`)
              if (ref.object?.type !== 'tag' || !/^[a-f0-9]{40}$/u.test(ref.object.sha)) throw new Error('Source ref is not an annotated tag')
              const tag = await github(`git/tags/${ref.object.sha}`)
              const provenance = assertSourceProvenance(release, tag)
              const source = {
                repository: config.sourceRepository, tag: config.tag, sha: provenance.sha,
                name: release.name, body: release.body, prerelease: release.prerelease,
                assets: release.assets.map(asset => ({ name: asset.name, size: asset.size, digest: asset.digest })),
              }
              validateMirrorSource(source)
              if (source.sha !== PROBE_SOURCE_SHA || [...PROBE_SMALL_SIZES].some(([name, size]) => source.assets.find(asset => asset.name === name)?.size !== size)) throw new Error('Source release differs from the fixed checksum probe')
              const marker = mirrorMarker(source)
              const rawApi = createGitcodeApi(config, probeFetch)
              const api = (endpoint, body, allow404 = false, method = 'GET') => {
                if (body !== undefined || method !== 'GET') throw new Error('Checksum probe API is read-only')
                return rawApi(endpoint, undefined, allow404, 'GET')
              }
              const endpoint = `releases/tags/${config.tag}`
              const readOwned = async () => {
                const current = await api(endpoint, undefined, true)
                probeAssertOwnedRelease(current, source, marker)
                return current
              }
              const verifyExisting = async current => {
                // Inventory and reject duplicates/large assets before the first hash GET.
                const present = probePresentExpected(current, source)
                for (const asset of present) {
                  const actual = await anonymousAssetDigest(config.repository, source.tag, asset, probeFetch)
                  if (actual.size !== asset.size || actual.digest !== asset.digest) throw new Error('Existing attachment conflicts with provenance')
                  console.log(`Verified existing small attachment: ${asset.name} (${asset.size} bytes)`)
                }
                return new Set(present.map(asset => asset.name))
              }
              probePhase = 'public repository and existing attachment verification'
              if ((await api('')).private !== false) throw new Error('GitCode target is not public')
              let present = await verifyExisting(await readOwned())
              if (present.has(PROBE_UPLOAD_NAME)) {
                console.log('Checksum probe complete: existing SHA256SUMS is anonymously verified; no upload needed')
                return
              }
              probePhase = 'download and verify GitHub checksum bytes'
              const githubAsset = release.assets.find(asset => asset.name === PROBE_UPLOAD_NAME)
              if (!Number.isSafeInteger(githubAsset?.id) || githubAsset.id <= 0) throw new Error('Invalid source checksum asset ID')
              const asset = source.assets.find(asset => asset.name === PROBE_UPLOAD_NAME)
              const { stdout: bytes } = await probeCommand('gh', ['api', `repos/${config.sourceRepository}/releases/assets/${githubAsset.id}`, '--method', 'GET', '-H', 'Accept: application/octet-stream'], 'buffer', 4096)
              probeAssertChecksumBytes(asset, bytes)
              probeDirectory = await probeMkdtemp(probeJoin(probeTmpdir(), 'ebao-checksum-probe-'))
              const path = probeJoin(probeDirectory, PROBE_UPLOAD_NAME)
              await probeWriteFile(path, bytes, { flag: 'wx', mode: 0o600 })
              probePhase = 'repeat ownership and attachment verification immediately before upload'
              present = await verifyExisting(await readOwned())
              if (present.has(PROBE_UPLOAD_NAME)) {
                console.log('Checksum probe complete: SHA256SUMS appeared and was anonymously verified; no overwrite')
                return
              }
              if (probeDeadline.aborted || probeRemaining() < 65_000) throw new Error('Insufficient remaining probe budget for one upload')
              const curlPut = createCurlPutFetch({ fetchImpl: probeFetch })
              const uploadFetch = (input, init) => curlPut(input, {
                ...init, signal: AbortSignal.any([init.signal, probeDeadline]),
              })
              probePhase = 'SHA256SUMS upload'
              console.log('Checksum probe upload begin: SHA256SUMS (379 bytes; cURL maximum 60 seconds)')
              await uploadGitcodeAsset(api, source.tag, { ...asset, path }, uploadFetch)
              probePhase = 'SHA256SUMS anonymous byte/hash verification'
              const actual = await anonymousAssetDigest(config.repository, source.tag, asset, probeFetch)
              if (actual.size !== asset.size || actual.digest !== asset.digest) throw new Error('Uploaded checksum differs from provenance')
              probePhase = 'final ownership and attachment inventory verification'
              const final = await readOwned()
              const finalPresent = probePresentExpected(final, source)
              if (!finalPresent.some(entry => entry.name === PROBE_UPLOAD_NAME)) throw new Error('Uploaded checksum missing from final inventory')
              console.log('Checksum probe complete: SHA256SUMS uploaded and anonymously hash-verified; release body untouched')
            } catch {
              // Do not print unknown causes, GitHub/API bodies, signed URLs or headers.
              throw new Error(`Checksum probe failed during ${probePhase}; no later upload attempted`)
            } finally {
              if (probeDirectory) await probeRm(probeDirectory, { recursive: true, force: true })
            }
          }

          await runSmallProbe()
          NODE
