# Temporary operational control; keep on the audit branch and do not promote to dev/master.
# Issues encrypted temporary upload capabilities for already verified v0.0.15 bytes.
name: Issue encrypted GitCode v0.0.15 upload capabilities

on:
  push:
    branches: [codex/gitcode-recovery-v0.0.15]

permissions:
  contents: read

concurrency:
  group: gitcode-mirror
  cancel-in-progress: false

jobs:
  issue:
    if: >-
      github.repository == 'cqai-club/ebao-studio' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/gitcode-recovery-v0.0.15' &&
      vars.GITCODE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cqai-club/ebao-studio
          ref: d5a9fa00f091e54f1c64f9641831b85c00e5bd0d
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable execution source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d5a9fa00f091e54f1c64f9641831b85c00e5bd0d
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Issue encrypted missing-package upload capabilities
        env:
          SOURCE_REPOSITORY: cqai-club/ebao-studio
          GITCODE_REPOSITORY: g-dxw/ebao-studio
          RELEASE_TAG: v0.0.15
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          CAP_PUBLIC_KEY_B64: ''
          CAP_SESSION_ID: 'f3aca3bc-e8c8-4a87-8b60-0db990086c05'
          CAP_OUTPUT_PATH: ${{ runner.temp }}/gitcode-capabilities.enc.json
        run: |
          node --input-type=module <<'NODE'
          /** One-session encrypted capabilities. This module performs no I/O on import. */
          import { execFile } from 'node:child_process'
          import { createCipheriv, createHash, createPublicKey, constants, publicEncrypt, randomBytes } from 'node:crypto'
          import { writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import { promisify } from 'node:util'
          import { pathToFileURL } from 'node:url'

          export const CAP_SOURCE_SHA = 'd5a9fa00f091e54f1c64f9641831b85c00e5bd0d'
          export const CAP_SOURCE_REPO = 'cqai-club/ebao-studio'
          export const CAP_TARGET_REPO = 'g-dxw/ebao-studio'
          export const CAP_TAG = 'v0.0.15'
          export const CAP_LIFETIME_MS = 20 * 60_000
          export const CAP_SOURCE_FILES = ['scripts/sync-gitcode-release.mjs', 'scripts/release-flow.mjs', 'scripts/verify-release-assets.mjs']
          export const CAP_ASSETS = [
            { name: 'eBao-Studio-0.0.15.dmg', size: 781003561, digest: 'sha256:11fb6d6b703739ba011083df522288b44198c9beac525bb4afdab42d7e9e959b' },
            { name: 'eBao-Studio-0.0.15.zip', size: 755854210, digest: 'sha256:81acc2cc77ea952f6e2d361cfc65229409eaed583b095666fb69ddf5547d7ff1' },
            { name: 'eBao-Studio-0.0.15-x64-Setup.exe', size: 347694735, digest: 'sha256:aee109ea5b80301490f1eed6c9f2da7329796c63984fd6a2d6d2e56889f29b8b' },
            { name: 'eBao-Studio-0.0.15-x64-Portable.zip', size: 524425989, digest: 'sha256:72738a2119dae51070d0fc8ea06c63b4a6595bf784f0c326f0b7d1447451b224' },
          ]
          const exec = promisify(execFile)
          export const capCanonical = value => JSON.stringify(value, (_, item) => item && !Array.isArray(item) && typeof item === 'object' ? Object.fromEntries(Object.entries(item).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) : item)
          export function capArguments(argv, allowed) {
            const values = {}
            for (let i = 0; i < argv.length; i += 2) {
              if (!allowed.includes(argv[i]) || !argv[i + 1] || argv[i + 1].startsWith('--') || Object.hasOwn(values, argv[i])) throw new Error('Invalid capability command arguments')
              values[argv[i]] = argv[i + 1]
            }
            if (Object.keys(values).length !== allowed.length) throw new Error('Missing capability command arguments')
            return values
          }
          export async function capLoadFixedSource(directory = process.cwd()) {
            const { stdout } = await exec('git', ['rev-parse', 'HEAD'], { cwd: directory, timeout: 20_000 })
            if (stdout.trim() !== CAP_SOURCE_SHA) throw new Error('Wrong fixed execution source')
            await exec('git', ['diff', '--quiet', CAP_SOURCE_SHA, '--', ...CAP_SOURCE_FILES], { cwd: directory, timeout: 20_000 })
            return import(pathToFileURL(resolve(directory, CAP_SOURCE_FILES[0])).href)
          }
          export function capAssertSource(source, validateMirrorSource) {
            validateMirrorSource(source)
            if (source.repository !== CAP_SOURCE_REPO || source.tag !== CAP_TAG || source.sha !== CAP_SOURCE_SHA) throw new Error('Wrong capability source')
            for (const fixed of CAP_ASSETS) {
              const actual = source.assets.find(asset => asset.name === fixed.name)
              if (actual?.size !== fixed.size || actual.digest !== fixed.digest) throw new Error('Source package differs from fixed release bytes')
            }
          }
          export function capAssertOwnedRelease(release, source, marker) {
            if (!release || release.tag_name !== CAP_TAG || release.target_commitish !== source.sha || release.release_status !== 'pre'
              || typeof release.body !== 'string' || !release.body.includes(marker) || !Array.isArray(release.assets)) throw new Error('Existing release ownership check failed')
            const present = []
            for (const asset of source.assets) {
              const matches = release.assets.filter(entry => entry?.name === asset.name)
              if (matches.length > 1) throw new Error('Duplicate expected attachment')
              if (matches.length) present.push(asset)
            }
            return present
          }
          export function capValidateTarget(cap) {
            let url
            try { url = new URL(cap?.url) } catch { throw new Error('Invalid capability target') }
            if (url.protocol !== 'https:' || url.username || url.password || url.hash || !cap.headers || Object.getPrototypeOf(cap.headers) !== Object.prototype) throw new Error('Invalid capability target')
            const names = new Set()
            for (const [name, value] of Object.entries(cap.headers)) {
              const lower = name.toLowerCase()
              if (!/^[!#$%&'*+.^_`|~0-9A-Za-z-]+$/u.test(name) || typeof value !== 'string' || /[\r\n\0]/u.test(value) || names.has(lower)) throw new Error('Invalid capability headers')
              if (lower === 'content-length' && name !== 'Content-Length') throw new Error('Ambiguous capability content length')
              names.add(lower)
            }
          }
          export function capAssertNoPersistentToken(cap, token) {
            if (typeof token !== 'string' || !token) throw new Error('Missing persistent token safety input')
            const base64 = Buffer.from(token).toString('base64')
            const forms = [token, encodeURIComponent(token), base64, encodeURIComponent(base64), Buffer.from(token).toString('base64url')]
            const check = text => { if (forms.some(form => text.includes(form))) throw new Error('Capability contains persistent authentication material') }
            const headers = Object.values(cap.headers || {})
            for (const text of [cap.url, ...headers]) {
              if (typeof text !== 'string') throw new Error('Invalid capability safety input')
              check(text)
              try { check(decodeURIComponent(text)) } catch (error) { if (!(error instanceof URIError)) throw error }
            }
            for (const text of headers) {
              if (text.length > 32768 || !/^[A-Za-z0-9+/_-]+={0,2}$/u.test(text)) continue
              const decoded = Buffer.from(text, 'base64').toString('utf8')
              check(decoded)
              try { check(decodeURIComponent(decoded)) } catch (error) { if (!(error instanceof URIError)) throw error }
            }
          }
          export function capAssertHeader(header, { sessionId, runId, controlSha, controlRef, keyFingerprint, now = Date.now() }) {
            if (header?.schema !== 1 || header.sessionId !== sessionId || !/^[A-Za-z0-9_-]{16,128}$/u.test(sessionId)
              || header.issuerRunId !== runId || !/^[1-9][0-9]*$/u.test(runId)
              || header.issuerControlSha !== controlSha || !/^[a-f0-9]{40}$/u.test(controlSha)
              || header.issuerRef !== controlRef || !/^refs\/heads\/codex\/[A-Za-z0-9._/-]+$/u.test(controlRef)
              || header.sourceRepository !== CAP_SOURCE_REPO || header.sourceSha !== CAP_SOURCE_SHA || header.tag !== CAP_TAG
              || header.targetRepository !== CAP_TARGET_REPO || header.recipientKeySha256 !== keyFingerprint) throw new Error('Envelope session/source binding failed')
            const issued = Date.parse(header.issuedAt), expires = Date.parse(header.expiresAt)
            if (!Number.isFinite(issued) || !Number.isFinite(expires) || expires - issued !== CAP_LIFETIME_MS
              || new Date(issued).toISOString() !== header.issuedAt || new Date(expires).toISOString() !== header.expiresAt
              || issued > now + 60_000 || now >= expires) throw new Error('Envelope is expired or has an invalid local deadline')
          }
          export function capValidatePayload(payload, validateMirrorSource) {
            if (!payload || !Array.isArray(payload.assets)) throw new Error('Invalid capability payload')
            capAssertSource(payload.source, validateMirrorSource)
            const names = new Set()
            for (const asset of payload.assets) {
              const fixed = CAP_ASSETS.find(entry => entry.name === asset.name)
              if (!fixed || names.has(asset.name) || asset.size !== fixed.size || asset.digest !== fixed.digest || asset.method !== 'PUT') throw new Error('Capability is outside the four fixed packages')
              capValidateTarget(asset.cap)
              if (asset.cap.headers['Content-Length'] !== undefined && asset.cap.headers['Content-Length'] !== String(fixed.size)) throw new Error('Invalid capability content length')
              names.add(asset.name)
            }
          }
          export async function issueCapabilities(argv = process.argv.slice(2), env = process.env) {
            let phase = 'arguments and immutable source', aesKey, plaintext
            try {
              const args = capArguments(argv, ['--output', '--session-id'])
              if (env.GITHUB_ACTIONS !== 'true' || env.GITHUB_REPOSITORY !== CAP_SOURCE_REPO || !/^[1-9][0-9]*$/u.test(env.GITHUB_RUN_ID || '')
                || !/^[a-f0-9]{40}$/u.test(env.GITHUB_SHA || '') || !/^refs\/heads\/codex\/[A-Za-z0-9._/-]+$/u.test(env.GITHUB_REF || '')
                || !/^[A-Za-z0-9_-]{16,128}$/u.test(args['--session-id'])) throw new Error('Issuer requires the approved official Actions session')
              const original = await capLoadFixedSource()
              const config = original.gitcodeConfig(env)
              if (config.repository !== CAP_TARGET_REPO || config.tag !== CAP_TAG) throw new Error('Wrong capability destination')
              const deadline = AbortSignal.timeout(6 * 60_000)
              const nativeFetch = (input, init = {}) => fetch(input, { ...init, signal: init.signal ? AbortSignal.any([init.signal, deadline]) : deadline })
              const childEnv = { ...env }; delete childEnv.GITCODE_TOKEN
              const github = async endpoint => JSON.parse((await exec('gh', ['api', `repos/${CAP_SOURCE_REPO}/${endpoint}`], {
                env: childEnv, timeout: 30_000, signal: deadline, killSignal: 'SIGKILL', maxBuffer: 2 * 1024 * 1024,
              })).stdout)
              phase = 'GitHub release and annotated-tag provenance'
              const release = await github(`releases/tags/${CAP_TAG}`)
              const ref = await github(`git/ref/tags/${CAP_TAG}`)
              if (ref.object?.type !== 'tag' || !/^[a-f0-9]{40}$/u.test(ref.object.sha)) throw new Error('Source tag lacks annotated provenance')
              const provenance = original.assertSourceProvenance(release, await github(`git/tags/${ref.object.sha}`))
              const source = { repository: CAP_SOURCE_REPO, tag: CAP_TAG, sha: provenance.sha, name: release.name, body: release.body, prerelease: release.prerelease,
                assets: release.assets.map(asset => ({ name: asset.name, size: asset.size, digest: asset.digest })) }
              capAssertSource(source, original.validateMirrorSource)
              const marker = original.mirrorMarker(source)
              const rawApi = original.createGitcodeApi(config, nativeFetch)
              const api = (endpoint, body, allow404 = false, method = 'GET') => {
                if (body !== undefined || method !== 'GET') throw new Error('Issuer API is read-only')
                return rawApi(endpoint, undefined, allow404, 'GET')
              }
              phase = 'public existing release and all present attachment hashes'
              if ((await api('')).private !== false) throw new Error('Target is not public')
              const endpoint = `releases/tags/${CAP_TAG}`
              const existing = await api(endpoint, undefined, true)
              const present = capAssertOwnedRelease(existing, source, marker)
              for (const asset of present) {
                const actual = await original.anonymousAssetDigest(CAP_TARGET_REPO, CAP_TAG, asset, nativeFetch)
                if (actual.size !== asset.size || actual.digest !== asset.digest) throw new Error('Existing attachment conflicts with provenance')
              }
              phase = 'temporary package capability issuance'
              const missing = CAP_ASSETS.filter(asset => !present.some(entry => entry.name === asset.name))
              const assets = []
              for (const asset of missing) {
                const current = capAssertOwnedRelease(await api(endpoint, undefined, true), source, marker)
                if (current.length !== present.length || current.some(entry => !present.some(verified => verified.name === entry.name))) throw new Error('Attachment inventory changed during capability issuance; rerun preflight')
                const cap = await api(`releases/${CAP_TAG}/upload_url?file_name=${encodeURIComponent(asset.name)}`)
                capValidateTarget(cap)
                capAssertNoPersistentToken(cap, config.token)
                assets.push({ ...asset, method: 'PUT', cap: { url: cap.url, headers: cap.headers } })
              }
              const payload = { source, assets }
              capValidatePayload(payload, original.validateMirrorSource)
              capAssertNoPersistentToken({ url: JSON.stringify(payload), headers: {} }, config.token)
              phase = 'encrypting one-session capabilities'
              if (!/^[A-Za-z0-9+/]+={0,2}$/u.test(env.CAP_PUBLIC_KEY_B64 || '')) throw new Error('Missing recipient public SPKI key')
              const publicKey = createPublicKey({ key: Buffer.from(env.CAP_PUBLIC_KEY_B64, 'base64'), type: 'spki', format: 'der' })
              if (publicKey.asymmetricKeyType !== 'rsa' || publicKey.asymmetricKeyDetails?.modulusLength !== 3072) throw new Error('Recipient key must be temporary RSA3072')
              const now = Date.now()
              const header = { schema: 1, sessionId: args['--session-id'], issuerRunId: env.GITHUB_RUN_ID, issuerControlSha: env.GITHUB_SHA, issuerRef: env.GITHUB_REF, sourceRepository: CAP_SOURCE_REPO,
                sourceSha: CAP_SOURCE_SHA, tag: CAP_TAG, targetRepository: CAP_TARGET_REPO, issuedAt: new Date(now).toISOString(), expiresAt: new Date(now + CAP_LIFETIME_MS).toISOString(),
                recipientKeySha256: createHash('sha256').update(publicKey.export({ type: 'spki', format: 'der' })).digest('hex') }
              capAssertHeader(header, { sessionId: args['--session-id'], runId: env.GITHUB_RUN_ID, controlSha: env.GITHUB_SHA, controlRef: env.GITHUB_REF, keyFingerprint: header.recipientKeySha256, now })
              aesKey = randomBytes(32)
              const iv = randomBytes(12), cipher = createCipheriv('aes-256-gcm', aesKey, iv)
              cipher.setAAD(Buffer.from(capCanonical(header)))
              plaintext = Buffer.from(JSON.stringify(payload))
              const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()])
              const envelope = { header, wrappedKey: publicEncrypt({ key: publicKey, padding: constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, aesKey).toString('base64'),
                iv: iv.toString('base64'), authTag: cipher.getAuthTag().toString('base64'), ciphertext: ciphertext.toString('base64') }
              await writeFile(resolve(args['--output']), JSON.stringify(envelope) + '\n', { flag: 'wx', mode: 0o600 })
              console.log(`Encrypted capability count: ${assets.length}; package names: ${assets.map(asset => asset.name).join(', ')}`)
            } catch { throw new Error(`Capability issuer stopped during ${phase}`) }
            finally { aesKey?.fill(0); plaintext?.fill(0) }
          }

          await issueCapabilities(['--output', process.env.CAP_OUTPUT_PATH, '--session-id', process.env.CAP_SESSION_ID]).catch(error => { console.error(error.message); process.exitCode = 1 })
          NODE
      - name: Save encrypted one-session capabilities
        uses: actions/upload-artifact@v7
        with:
          name: gitcode-upload-capabilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitcode-capabilities.enc.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
