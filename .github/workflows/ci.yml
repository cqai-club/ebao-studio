name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Keep the established required contexts conclusive during the cutover.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed-file whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check "$HEAD_SHA"
          fi

  official-desktop:
    needs: changes
    name: Official Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          # Validate the exact PR head and the official source pin together.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Initialize only the official source
        run: git submodule update --init --recursive -- deepseek-harness
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Install the root command workspace
        run: corepack yarn install --immutable
      - name: Install the pinned official workspace
        run: corepack yarn upstream:install
      - name: Prepare Electron for Windows signal checks
        if: runner.os == 'Windows'
        # Install the runtime binary without launching the graphical application.
        run: corepack yarn upstream:prepare-electron
      - name: Run headless official Desktop checks
        # The root check builds and validates official source without starting
        # Electron. Dormant CQAI plugins are outside this application gate.
        run: corepack yarn check

  check:
    if: ${{ always() }}
    needs: [changes, official-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every headless platform check
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP_RESULT: ${{ needs.official-desktop.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$DESKTOP_RESULT" = success
