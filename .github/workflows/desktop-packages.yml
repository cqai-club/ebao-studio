name: Desktop packages

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'deepseek-harness'
      - 'package.json'
      - 'assets/desktop-brand/**'
      - 'scripts/official-desktop.mjs'
      - 'scripts/package-ebao-desktop.mjs'
      - 'scripts/publisher-worker-paths.mjs'
      - 'scripts/prepare-*.mjs'
      - 'integrations/**'
      - 'cqai-dsh-plugins/**'
      - 'dsh-community-market/**'
      - 'matrixmedia-publisher'
      - 'vendor/matrixmedia/publisher-worker.json'
      - 'vendor/ppt-runtime/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Package / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-latest
            command: dist:mac:arm64
            extension: dmg
          - target: mac-x64
            runner: macos-15-intel
            command: dist:mac:x64
            extension: dmg
          - target: win-x64
            runner: windows-latest
            command: dist:win
            extension: exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.5
      - name: Build the pinned Publisher Worker
        id: publisher-worker
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          git -c core.autocrlf=false submodule update --init --recursive -- matrixmedia-publisher
          node scripts/verify-publisher-source.mjs
          corepack enable
          node scripts/install-matrixmedia-ci.mjs
          cd matrixmedia-publisher
          corepack yarn@1.22.22 test:publisher-worker
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            corepack yarn@1.22.22 build:dir
            corepack yarn@1.22.22 electron-builder --config electron-builder.publisher.yml --win dir --x64 --publish never
            node ../scripts/smoke-windows-publisher-worker.mjs
          else
            corepack yarn@1.22.22 build:publisher-worker:universal
          fi
      - name: Restore the Publisher Worker lock if interrupted
        if: ${{ always() && (steps.publisher-worker.outcome == 'failure' || steps.publisher-worker.outcome == 'cancelled') }}
        run: node scripts/install-matrixmedia-ci.mjs --restore
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Install the root command workspace
        run: corepack yarn install --immutable
      - name: Initialize the pinned official workspace
        run: corepack yarn setup
      - name: Build and verify unsigned e宝 installer
        run: corepack yarn ${{ matrix.command }}
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ebao-${{ matrix.target }}
          path: deepseek-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/eBao-Studio-*-${{ matrix.target }}-unsigned.${{ matrix.extension }}
          if-no-files-found: error
