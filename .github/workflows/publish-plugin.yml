name: Publish plugin

# Publish one CQAI DSH plugin package to the public npm registry, where the
# Community Market resolves it. Optional plugins such as e研宝 are never part
# of the Desktop install bundle, so this is the only path that makes them
# installable for users.
#
# Two entry points:
#   * workflow_dispatch with an explicit plugin directory and version.
#   * a tag named `plugin-<package-name>-v<MAJOR.MINOR.PATCH>`, for example
#     `plugin-cqai-dsh-plugin-research-v0.1.0`. The tag names both the package
#     and the version, so it can never publish the wrong artifact.
#
# Requires an npm automation token stored as the `NPM_TOKEN` repository secret
# that is allowed to publish the package. Set `dry_run` (or dispatch without a
# token) to rehearse the whole gate without publishing.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Workspace-relative plugin directory, e.g. cqai-dsh-plugins/cqai-dsh-plugin-research
        required: true
        type: string
      version:
        description: Exact stable SemVer to publish; must equal the package manifest version
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing to npm
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'plugin-*-v*'

permissions:
  contents: read

concurrency:
  group: publish-plugin-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Resolve the requested plugin and version from either entry point, so the
  # publish job never has to reinterpret a tag.
  plan:
    runs-on: ubuntu-latest
    outputs:
      plugin_dir: ${{ steps.resolve.outputs.plugin_dir }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      version: ${{ steps.resolve.outputs.version }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Resolve the plugin, version and rehearsal flag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLUGIN: ${{ inputs.plugin }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          TAG_NAME: ${{ github.ref_name }}
        # The resolution rules are unit-tested in
        # scripts/resolve-plugin-release.test.mjs rather than inline here.
        run: node scripts/resolve-plugin-release.mjs >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which ties the published tarball to this
      # workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: publish-plugin-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable

      - name: Typecheck and test the plugin
        run: |
          set -euo pipefail
          yarn workspace '${{ needs.plan.outputs.package_name }}' typecheck
          yarn workspace '${{ needs.plan.outputs.package_name }}' test

      - name: Build the plugin
        run: yarn workspace '${{ needs.plan.outputs.package_name }}' build

      - name: Pack the plugin and capture the tarball manifest
        working-directory: ${{ needs.plan.outputs.plugin_dir }}
        run: |
          set -euo pipefail
          # `npm pack` runs prepack, which rebuilds lib/ so the tarball always
          # carries a fresh artifact. Lifecycle output shares this stream, so
          # the gate locates the JSON payload inside the captured file.
          npm pack --dry-run --json > pack.json

      - name: Verify the package is publishable and Market-shaped
        run: |
          set -euo pipefail
          node scripts/verify-plugin-publish.mjs \
            --plugin-dir '${{ needs.plan.outputs.plugin_dir }}' \
            --pack-json '${{ needs.plan.outputs.plugin_dir }}/pack.json' \
            --expected-version '${{ needs.plan.outputs.version }}'

      - name: Refuse to republish an existing version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name='${{ needs.plan.outputs.package_name }}'
          version='${{ needs.plan.outputs.version }}'
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published; bump the version first." >&2
            exit 1
          fi
          echo "$package_name@$version is not published yet."

      - name: Publish to npm
        if: needs.plan.outputs.dry_run != 'true'
        working-directory: ${{ needs.plan.outputs.plugin_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo 'The NPM_TOKEN repository secret is not configured.' >&2
            exit 1
          fi
          # prepack rebuilds lib/ again, so the published tarball matches the
          # verified build inputs.
          npm publish --access public --provenance

      - name: Report the rehearsal result
        if: needs.plan.outputs.dry_run == 'true'
        env:
          PACKAGE_NAME: ${{ needs.plan.outputs.package_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          echo "Dry run: $PACKAGE_NAME@$VERSION passed every check and was not published."

      - name: Verify the published manifest
        if: needs.plan.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package_name='${{ needs.plan.outputs.package_name }}'
          version='${{ needs.plan.outputs.version }}'
          npm view "$package_name@$version" --json > published.json
          node scripts/verify-plugin-publish.mjs \
            --registry-manifest published.json \
            --expected-version "$version"

      - name: Summarize
        if: always()
        env:
          PACKAGE_NAME: ${{ needs.plan.outputs.package_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PLUGIN_DIR: ${{ needs.plan.outputs.plugin_dir }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          {
            echo "## Plugin publish"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| package | \`$PACKAGE_NAME\` |"
            echo "| version | \`$VERSION\` |"
            echo "| directory | \`$PLUGIN_DIR\` |"
            echo "| dry run | $DRY_RUN |"
          } >> "$GITHUB_STEP_SUMMARY"
